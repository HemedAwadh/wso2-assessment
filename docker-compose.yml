# Jamii Savings – local / CI target environment.
#
#   docker compose up -d --build                  # DB + mocks + MI
#   docker compose --profile apim up -d           # ... plus API Manager (needs ~4 GB RAM)
#
# MI starts empty; scripts/deploy-mi.sh copies the built CARs into it and
# scripts/deploy-apim.sh imports the APIs into APIM with apictl.

name: jamii

services:
  accounts-db:
    image: postgres:16-alpine
    container_name: accounts_postgres  # Changed to match the service context (was local_postgres)
    restart: always
    environment:
      # Postgres uses POSTGRES_USER as the superuser (replaces MYSQL_ROOT_PASSWORD)
      POSTGRES_USER: ${ACCOUNTS_DB_USER:-jamii_app}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-change-me-app}
      POSTGRES_DB: ${ACCOUNTS_DB_NAME:-jamii_accounts}
    volumes:
      # Postgres uses the exact same init directory structure as MySQL!
      - ./database/accounts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/accounts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - accounts-db-data:/var/lib/postgresql/data
    ports:
      - "${ACCOUNTS_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      # Replaced mysqladmin ping with pg_isready
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30


  customer-mock:
    build: ./mocks/customer-service-springboot
    environment:
      SLOW_DELAY_MS: "15000"
    ports:
      - "3000:3000"

  soap-mock:
    build: ./mocks/loan-eligibility-soap-springboot
    ports:
      - "8088:8088"

  rabbitmq:
    # Bonus B: loan-application events. Topology (exchange, retry and dead-letter
    # queues) comes from infrastructure/docker/rabbitmq/definitions.json.
    image: rabbitmq:4.1-management-alpine
    volumes:
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-jamii.conf:ro
      - ./infrastructure/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI / HTTP API (jamii / jamii-dev-only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  mi:
    build:
      context: ./infrastructure/docker/mi
    environment:
      ACCOUNTS_DB_URL: "jdbc:postgresql://accounts-db:5432/${ACCOUNTS_DB_NAME:-jamii_accounts}?sslmode=disable&connectTimeout=3&socketTimeout=5"
      ACCOUNTS_DB_USER: ${ACCOUNTS_DB_USER:-jamii_app}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-change-me-app}
      CUSTOMER_BACKEND_URL: ${CUSTOMER_BACKEND_URL:-https://jsonplaceholder.typicode.com}
      LOAN_SOAP_BACKEND_URL: ${LOAN_SOAP_BACKEND_URL:-http://www.dneonline.com/calculator.asmx}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-jamii}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-jamii-dev-only}
    ports:
      - "8290:8290"   # HTTP APIs
      - "8253:8253"   # HTTPS APIs
      - "9164:9164"   # Management API (used by deploy-mi.sh)
    volumes:
      # Deployed CARs survive container re-creation (e.g. switching backends).
      - mi-carbonapps:/home/wso2carbon/wso2mi-4.6.0/repository/deployment/server/carbonapps
    depends_on:
      accounts-db:
        condition: service_healthy
      customer-mock:
        condition: service_started
      soap-mock:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  apim:
    image: wso2/wso2am:4.6.0
    profiles: ["apim"]
    ports:
      - "9443:9443"   # Publisher / Dev Portal / Admin / REST APIs
      - "8243:8243"   # Gateway HTTPS
      - "8280:8280"   # Gateway HTTP
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9443/services/Version || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    depends_on:
      - mi

volumes:
  accounts-db-data:
  mi-carbonapps:
